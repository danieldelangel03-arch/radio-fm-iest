services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: radio_campus
      POSTGRES_USER: radio
      POSTGRES_PASSWORD: radio_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radio -d radio_campus"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - radio_postgres_data:/var/lib/postgresql/data

volumes:
  radio_postgres_data:
